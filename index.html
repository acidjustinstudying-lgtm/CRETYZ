   CRETYZ v2 - Part 1 / ??? (새 스토리 기준 재시작)
   Core 시스템 + 인큐베이션(5일 육성)

// ---------- Core Enums ----------

// 오리진의 성장 스타일. 인큐베이션 5일간의 물/햇빛 비율로 딱 한 번 결정되고,
// 그 이후로는 바뀌지 않는다 (구버전처럼 실시간 재계산 안 함).
const GrowthStyle = Object.freeze({
  OFFENSIVE: "OFFENSIVE",
  DEFENSIVE: "DEFENSIVE",
  BALANCED: "BALANCED"
});

// 10개 챕터. 순서 = 스토리 진행 순서. 저장 데이터 호환을 위해 새 챕터는 끝에만 추가.
const ChapterType = Object.freeze({
  FORGOTTEN_GRASSLANDS: 1,   // 1장 - 잊혀진 초원 (튜토리얼)
  MUSHROOM_FOREST: 2,        // 2장 - 버섯의 숲
  SCORCHED_DESERT: 3,        // 3장 - 메마른 사막 (스킬조합 해금)
  FROST_VALLEY: 4,           // 4장 - 서리 계곡
  CRIMSON_VOLCANO: 5,        // 5장 - 붉은 화산림
  FLORIA_CAPITAL: 6,         // 6장 - 꽃의 수도 플로리아
  SKY_GARDEN: 7,             // 7장 - 하늘정원 에테리아
  CANYON_OF_DEATH: 8,        // 8장 - 죽음의 협곡
  FINAL_BATTLEGROUND: 9,     // 9장 - 마지막 결전장
  WORLD_TREE: 10             // 10장 - 세계수
});

// 실시간 전투(브롤스타즈식)에서 스킬에 걸리는 상태이상. 비트플래그로 중첩 가능.
const StatusEffectType = Object.freeze({
  NONE: 0,
  BURN: 1 << 0,
  FREEZE: 1 << 1,
  POISON: 1 << 2,
  SLOW: 1 << 3,
  STUN: 1 << 4
});

// ---------- GameEventBus ----------
// 전역 이벤트 버스. 모든 시스템이 서로 직접 참조하지 않고 이 버스를 통해서만 통신한다.
class GameEventBus {
  static #subscribers = new Map();

  static subscribe(eventName, handler) {
    if (!this.#subscribers.has(eventName)) {
      this.#subscribers.set(eventName, []);
    }
    this.#subscribers.get(eventName).push(handler);
  }

  static unsubscribe(eventName, handler) {
    if (!this.#subscribers.has(eventName)) return;
    const list = this.#subscribers.get(eventName);
    const idx = list.indexOf(handler);
    if (idx !== -1) list.splice(idx, 1);
    if (list.length === 0) this.#subscribers.delete(eventName);
  }

  static publish(eventName, payload) {
    if (!this.#subscribers.has(eventName)) return;
    const snapshot = [...this.#subscribers.get(eventName)];
    for (const handler of snapshot) {
      try {
        handler(payload);
      } catch (err) {
        console.error(`[GameEventBus] ${eventName} 처리 중 예외:`, err);
      }
    }
  }
}

// ---------- 이벤트 이름 상수 ----------
const CoreEvents = Object.freeze({
  DAY_ADVANCED: "OnDayAdvanced",
  ORIGIN_BORN: "OnOriginBorn",
  CHAPTER_CHANGED: "OnChapterChanged",
  STORY_FLAG_SET: "OnStoryFlagSet"
});

// ---------- GameManager ----------
// 전역 진행 상태(현재 챕터 등)를 관리하는 싱글톤.
class GameManager {
  static #instance = null;

  #currentChapter = ChapterType.FORGOTTEN_GRASSLANDS;

  static get instance() {
    if (!this.#instance) this.#instance = new GameManager();
    return this.#instance;
  }

  get currentChapter() { return this.#currentChapter; }

  advanceToChapter(chapter) {
    this.#currentChapter = chapter;
    GameEventBus.publish(CoreEvents.CHAPTER_CHANGED, { chapter });
  }
}

// ---------- StoryFlags ----------
// 특정 스토리 이벤트가 이미 일어났는지 기억. 프롤로그/컷씬 중복 방지 및 분기 조건으로 사용.
class StoryFlags {
  static SAVE_KEY = "cretyz_v2_story_flags";

  constructor() {
    this.flags = new Set();
  }

  has(flagName) {
    return this.flags.has(flagName);
  }

  set(flagName) {
    if (this.flags.has(flagName)) return;
    this.flags.add(flagName);
    GameEventBus.publish(CoreEvents.STORY_FLAG_SET, { flagName });
    this.save();
  }

  toJSON() {
    return { flags: Array.from(this.flags) };
  }

  static fromJSON(json) {
    const state = new StoryFlags();
    state.flags = new Set(json.flags);
    return state;
  }

  save() {
    try {
      localStorage.setItem(StoryFlags.SAVE_KEY, JSON.stringify(this.toJSON()));
      return true;
    } catch (err) {
      console.error("[StoryFlags] 저장 실패:", err);
      return false;
    }
  }

  static load() {
    try {
      const raw = localStorage.getItem(StoryFlags.SAVE_KEY);
      if (!raw) return null;
      return StoryFlags.fromJSON(JSON.parse(raw));
    } catch (err) {
      console.error("[StoryFlags] 로드 실패:", err);
      return null;
    }
  }
}

// ---------- IncubationState ----------
// 5일간의 인큐베이션 단계. 이후의 OriginRuntimeState(다음 파트)와는 별개의,
// "태어나기 전" 상태만을 다루는 클래스. 하루 1회 물/햇빛 중 하나만 선택 가능.
class IncubationState {
  static SAVE_KEY = "cretyz_v2_incubation";
  static TOTAL_DAYS = 5;

  constructor() {
    this.dayCount = 0;           // 지금까지 지난 일수 (0~5)
    this.waterDays = 0;          // 물을 준 날 수
    this.sunlightDays = 0;       // 햇빛을 쬔 날 수
    this.todayChoiceMade = false;
    this.isBorn = false;
  }

  get isComplete() {
    return this.dayCount >= IncubationState.TOTAL_DAYS;
  }

  get daysRemaining() {
    return Math.max(0, IncubationState.TOTAL_DAYS - this.dayCount);
  }

  // 하루에 한 번만 호출 가능. water=true면 물주기, false면 햇빛쬐기.
  makeChoice(chooseWater) {
    if (this.isComplete) {
      console.warn("[IncubationState] 이미 인큐베이션이 끝났습니다.");
      return false;
    }
    if (this.todayChoiceMade) {
      console.warn("[IncubationState] 오늘은 이미 선택을 마쳤습니다.");
      return false;
    }

    if (chooseWater) {
      this.waterDays += 1;
    } else {
      this.sunlightDays += 1;
    }
    this.todayChoiceMade = true;
    this.save();
    return true;
  }

  // 하루가 지나감을 시뮬레이션 (실제 서비스에서는 자정 기준 실시간 체크로 교체 예정 - 지금은 프로토타입 단계)
  advanceDay() {
    if (!this.todayChoiceMade && !this.isComplete) {
      console.warn("[IncubationState] 오늘의 선택을 하지 않고는 다음 날로 넘어갈 수 없습니다.");
      return false;
    }

    this.dayCount += 1;
    this.todayChoiceMade = false;

    GameEventBus.publish(CoreEvents.DAY_ADVANCED, { dayCount: this.dayCount });

    if (this.isComplete && !this.isBorn) {
      this.isBorn = true;
      const finalStyle = this.#computeFinalStyle();
      GameEventBus.publish(CoreEvents.ORIGIN_BORN, { style: finalStyle });
    }

    this.save();
    return true;
  }

  // 5일간 물/햇빛 비율로 최종 성장 스타일을 확정. 이 값은 이후 OriginRuntimeState 생성 시
  // 그대로 주입되고, 그 뒤로는 변하지 않는다.
  #computeFinalStyle() {
    const total = this.waterDays + this.sunlightDays;
    if (total === 0) return GrowthStyle.BALANCED; // 예외 방어: 아무 선택도 안 한 경우

    const waterRatio = this.waterDays / total;
    if (waterRatio >= 0.65) return GrowthStyle.OFFENSIVE;
    if (waterRatio <= 0.35) return GrowthStyle.DEFENSIVE;
    return GrowthStyle.BALANCED;
  }

  toJSON() {
    return {
      dayCount: this.dayCount,
      waterDays: this.waterDays,
      sunlightDays: this.sunlightDays,
      todayChoiceMade: this.todayChoiceMade,
      isBorn: this.isBorn
    };
  }

  static fromJSON(json) {
    const state = new IncubationState();
    state.dayCount = json.dayCount;
    state.waterDays = json.waterDays;
    state.sunlightDays = json.sunlightDays;
    state.todayChoiceMade = json.todayChoiceMade;
    state.isBorn = json.isBorn;
    return state;
  }

  save() {
    try {
      localStorage.setItem(IncubationState.SAVE_KEY, JSON.stringify(this.toJSON()));
      return true;
    } catch (err) {
      console.error("[IncubationState] 저장 실패:", err);
      return false;
    }
  }

  static load() {
    try {
      const raw = localStorage.getItem(IncubationState.SAVE_KEY);
      if (!raw) return null;
      return IncubationState.fromJSON(JSON.parse(raw));
    } catch (err) {
      console.error("[IncubationState] 로드 실패:", err);
      return null;
    }
  }
}

// ---------- OriginRuntimeState ----------
// 인큐베이션이 끝난 뒤의 실제 오리진 상태. growthStyle은 인큐베이션 결과로 딱 한 번 고정되고
// 이후 바뀌지 않는다 (구버전처럼 실시간 재계산 안 함).
const OriginBaseStatsByStyle = {
  [GrowthStyle.OFFENSIVE]: { maxHealth: 30, attack: 8, defense: 2 },
  [GrowthStyle.DEFENSIVE]: { maxHealth: 45, attack: 4, defense: 6 },
  [GrowthStyle.BALANCED]:  { maxHealth: 36, attack: 6, defense: 4 }
};

class OriginRuntimeState {
  static SAVE_KEY = "cretyz_v2_origin";

  constructor(growthStyle) {
    this.growthStyle = growthStyle;
    const base = OriginBaseStatsByStyle[growthStyle];
    this.maxHealth = base.maxHealth;
    this.currentHealth = base.maxHealth;
    this.attack = base.attack;
    this.defense = base.defense;
    this.name = "잡초"; // 최종 엔딩 전까지 이 이름 고정. "Cretyz"로 바뀌는 건 엔딩 이벤트에서 처리
  }

  toJSON() {
    return {
      growthStyle: this.growthStyle,
      maxHealth: this.maxHealth,
      currentHealth: this.currentHealth,
      attack: this.attack,
      defense: this.defense,
      name: this.name
    };
  }

  static fromJSON(json) {
    const state = new OriginRuntimeState(json.growthStyle);
    state.currentHealth = json.currentHealth;
    state.name = json.name;
    return state;
  }

  save() {
    try {
      localStorage.setItem(OriginRuntimeState.SAVE_KEY, JSON.stringify(this.toJSON()));
      return true;
    } catch (err) {
      console.error("[OriginRuntimeState] 저장 실패:", err);
      return false;
    }
  }

  static load() {
    try {
      const raw = localStorage.getItem(OriginRuntimeState.SAVE_KEY);
      if (!raw) return null;
      return OriginRuntimeState.fromJSON(JSON.parse(raw));
    } catch (err) {
      console.error("[OriginRuntimeState] 로드 실패:", err);
      return null;
    }
  }
}

// ---------- 대화 시퀀스 ----------
const StoryScenes = {
  MEETING_JUSTIN: [
    { speaker: StoryCharacters.NARRATOR, text: "작은 잡초를 품에 안고, 주인공은 연구소로 향한다." },

// ---------- DialogueBox (자가생성 UI) ----------
(function initDialogueSystem() {
  const style = document.createElement("style");
  style.textContent = `
    #dialogue-overlay {
      display:none; position:fixed; left:0; right:0; bottom:0;
      background:rgba(10,20,12,0.97); padding:18px 20px; border-top:2px solid #3C6E32;
      z-index:1000;
    }
    #dialogue-speaker { font-weight:bold; color:#B6F09C; margin-bottom:6px; font-size:15px; }
    #dialogue-portrait { font-size:32px; float:left; margin-right:12px; }
    #dialogue-text { font-size:15px; line-height:1.5; min-height:44px; }
    #dialogue-next-btn {
      margin-top:12px; background:#3C6E32; color:#eafbe7; border:none;
      padding:8px 18px; border-radius:8px; cursor:pointer; float:right; font-size:14px;
    }
    #dialogue-clear { clear:both; }
  `;
  document.head.appendChild(style);

  const overlay = document.createElement("div");
  overlay.id = "dialogue-overlay";
  overlay.innerHTML = `
    <div id="dialogue-portrait"></div>
    <div id="dialogue-speaker"></div>
    <div id="dialogue-text"></div>
    <div id="dialogue-clear"></div>
    <button id="dialogue-next-btn">다음 ▶</button>
  `;
  document.body.appendChild(overlay);

  let activeScene = null;
  let activeLineIndex = 0;
  let onSceneEndCallback = null;

  // onEnd: 대화가 끝난 뒤 호출할 콜백 (예: 전투 시작 트리거)
  window.playDialogue = function playDialogue(sceneId, onEnd) {
    const scene = StoryScenes[sceneId];
    if (!scene) {
      console.warn(`[Dialogue] 존재하지 않는 장면: ${sceneId}`);
      return;
    }
    activeScene = scene;
    activeLineIndex = 0;
    onSceneEndCallback = onEnd || null;
    overlay.style.display = "block";
    renderCurrentLine();
  };

  function renderCurrentLine() {
    const line = activeScene[activeLineIndex];
    document.getElementById("dialogue-portrait").textContent = line.speaker.portrait;
    document.getElementById("dialogue-speaker").textContent = line.speaker.name;
    document.getElementById("dialogue-text").textContent = line.text;
  }

  document.getElementById("dialogue-next-btn").addEventListener("click", () => {
    activeLineIndex += 1;
    if (activeLineIndex >= activeScene.length) {
      overlay.style.display = "none";
      const cb = onSceneEndCallback;
      activeScene = null;
      onSceneEndCallback = null;
      if (cb) cb();
      return;
    }
    renderCurrentLine();
  });
})();

// ---------- 탄생 이후 흐름 연결 ----------
let playerOrigin = OriginRuntimeState.load() || null;
let storyFlags = StoryFlags.load() || new StoryFlags();

GameEventBus.subscribe(CoreEvents.ORIGIN_BORN, (e) => {
  playerOrigin = new OriginRuntimeState(e.style);
  playerOrigin.save();

  if (!storyFlags.has("seen_meeting_justin")) {
    playDialogue("MEETING_JUSTIN", () => {
      storyFlags.set("seen_meeting_justin");
      triggerEdenAttack();
    });
  }
});

function triggerEdenAttack() {
  if (storyFlags.has("seen_eden_attack")) return;
  playDialogue("EDEN_ATTACK", () => {
    storyFlags.set("seen_eden_attack");
    console.log("[Story] 여기서 첫 전투(브롤스타즈식 직접조작)가 시작됨 - 다음 파트에서 구현");
    // 다음 파트: startFirstBattle(); 형태로 연결 예정
  });
}

// 이미 탄생한 상태로 게임을 다시 열었을 경우, 아직 못 본 컷씬을 이어서 보여줌
window.addEventListener("load", () => {
  if (playerOrigin && !storyFlags.has("seen_meeting_justin")) {
    playDialogue("MEETING_JUSTIN", () => {
      storyFlags.set("seen_meeting_justin");
      triggerEdenAttack();
    });
  } else if (playerOrigin && storyFlags.has("seen_meeting_justin") && !storyFlags.has("seen_eden_attack")) {
    triggerEdenAttack();
  }

// ---------- OriginRuntimeState 확장 (프로토타입 방식 - 기존 클래스 재선언 안 함) ----------
OriginRuntimeState.prototype.getEvolutionStage = function () {
  return this.evolutionStage || 1;
};

// 챕터 진행도에 따라 2차(챕터3+)/3차(챕터8+) 진화 여부를 확인하고, 조건 충족 시 스탯을 갱신.
OriginRuntimeState.prototype.checkEvolution = function (currentChapterNumber) {
  const stage = this.getEvolutionStage();
  let newStage = stage;

  if (currentChapterNumber >= 8 && stage < 3) newStage = 3;
  else if (currentChapterNumber >= 3 && stage < 2) newStage = 2;

  if (newStage === stage) return; // 아직 조건 미달 - 정상 상황

  this.evolutionStage = newStage;
  this.#applyEvolutionStatsInternal();
  this.save();
  GameEventBus.publish(ChapterEvents.EVOLUTION_ADVANCED, {
    style: this.growthStyle, stage: newStage, name: this.name
  });
};

// private 필드는 프로토타입 확장에서 못 쓰므로 일반 메서드로 구현 (컨벤션상 접두사만 유지)
OriginRuntimeState.prototype["#applyEvolutionStatsInternal"] = undefined; // 사용 안 함 (JS 문법 제약 회피용 메모)
OriginRuntimeState.prototype.applyEvolutionStats = function () {
  const table = OriginEvolutionTable[this.growthStyle][this.getEvolutionStage()];
  const healthRatio = this.maxHealth > 0 ? this.currentHealth / this.maxHealth : 1;

  this.name = table.name;
  this.maxHealth = table.maxHealth;
  this.attack = table.attack;
  this.defense = table.defense;
  this.currentHealth = Math.round(this.maxHealth * healthRatio); // 체력 비율 유지
};
OriginRuntimeState.prototype["#applyEvolutionStatsInternal"] = OriginRuntimeState.prototype.applyEvolutionStats;

// toJSON / fromJSON도 evolutionStage를 저장/복원하도록 감싸서 확장 (원본 로직은 그대로 재사용)
const __originalOriginToJSON = OriginRuntimeState.prototype.toJSON;
OriginRuntimeState.prototype.toJSON = function () {
  const base = __originalOriginToJSON.call(this);
  base.evolutionStage = this.getEvolutionStage();
  return base;
};

const __originalOriginFromJSON = OriginRuntimeState.fromJSON;
OriginRuntimeState.fromJSON = function (json) {
  const state = __originalOriginFromJSON(json);
  state.evolutionStage = json.evolutionStage || 1;
  return state;
};

// ---------- PurificationInventory ----------
// 정화 구슬(5개=정화구 1개) 관리.
class PurificationInventory {
  static SAVE_KEY = "cretyz_v2_purification";

  constructor() {
    this.beadCount = 0;
    this.orbCount = 0;
  }

  addBeads(amount) {
    this.beadCount += amount;
    GameEventBus.publish(ChapterEvents.BEAD_COLLECTED, { amount, total: this.beadCount });

    while (this.beadCount >= 5) {
      this.beadCount -= 5;
      this.orbCount += 1;
      GameEventBus.publish(ChapterEvents.ORB_CRAFTED, { total: this.orbCount });
    }
    this.save();
  }

  // 오염도를 낮추는 데 정화구 1개 소모. 성공하면 true.
  consumeOrb() {
    if (this.orbCount <= 0) return false;
    this.orbCount -= 1;
    this.save();
    return true;
  }

  // 오염도 폭주 페널티: 정화구 절반 손실, 미완성 구슬은 전부 손실.
  applyOverloadPenalty() {
    this.orbCount = Math.floor(this.orbCount / 2);
    this.beadCount = 0;
    this.save();
  }

  toJSON() {
    return { beadCount: this.beadCount, orbCount: this.orbCount };
  }

  static fromJSON(json) {
    const inv = new PurificationInventory();
    inv.beadCount = json.beadCount;
    inv.orbCount = json.orbCount;
    return inv;
  }

  save() {
    try {
      localStorage.setItem(PurificationInventory.SAVE_KEY, JSON.stringify(this.toJSON()));
      return true;
    } catch (err) {
      console.error("[PurificationInventory] 저장 실패:", err);
      return false;
    }
  }

  static load() {
    try {
      const raw = localStorage.getItem(PurificationInventory.SAVE_KEY);
      if (!raw) return null;
      return PurificationInventory.fromJSON(JSON.parse(raw));
    } catch (err) {
      console.error("[PurificationInventory] 로드 실패:", err);
      return null;
    }
  }
}

// ---------- CorruptionGaugeState ----------
// 챕터(바이옴) 진입마다 0에서 시작. 시간 경과 + 몬스터 조우로 상승. 정화구로 낮출 수 있음.
class CorruptionGaugeState {
  static MAX_VALUE = 100;
  static PASSIVE_RISE_PER_SEC = 0.8;
  static RISE_PER_ENCOUNTER = 5;
  static REDUCE_PER_ORB = 25;

  constructor() {
    this.value = 0;
    this.isOverloaded = false;
  }

  tick(deltaSec) {
    if (this.isOverloaded) return;
    this.#add(CorruptionGaugeState.PASSIVE_RISE_PER_SEC * deltaSec);
  }

  onEncounter() {
    this.#add(CorruptionGaugeState.RISE_PER_ENCOUNTER);
  }

  reduceWithOrb(purificationInventory) {
    if (this.isOverloaded) return false;
    const consumed = purificationInventory.consumeOrb();
    if (!consumed) return false;
    this.value = Math.max(0, this.value - CorruptionGaugeState.REDUCE_PER_ORB);
    GameEventBus.publish(ChapterEvents.CORRUPTION_CHANGED, { value: this.value });
    return true;
  }

  #add(amount) {
    if (this.isOverloaded) return;
    this.value = Math.min(CorruptionGaugeState.MAX_VALUE, this.value + amount);
    GameEventBus.publish(ChapterEvents.CORRUPTION_CHANGED, { value: this.value });

    if (this.value >= CorruptionGaugeState.MAX_VALUE) {
      this.isOverloaded = true;
      GameEventBus.publish(ChapterEvents.CORRUPTION_OVERLOAD, {});
    }
  }
}

// ---------- FieldArena (챕터1 탐험용 - Part3의 BattleArena와 별개, 승리 가능한 실전투) ----------
class FieldArena {
  constructor(widthPx, heightPx) {
    this.width = widthPx;
    this.height = heightPx;

    this.playerPos = { x: widthPx / 2, y: heightPx * 0.8 };
    this.playerMaxHealth = playerOrigin.maxHealth;
    this.playerHealth = playerOrigin.currentHealth > 0 ? playerOrigin.currentHealth : playerOrigin.maxHealth;

    this.enemies = [];
    this.skillCooldowns = new Map();
    this.moveState = { up: false, down: false, left: false, right: false };

    this.corruption = new CorruptionGaugeState();
    this.killCount = 0;
    this.bossUnlocked = false;
    this.bossActive = false;
    this.isOver = false;
  }

  spawnRegularEnemy() {
    const pool = Object.values(ChapterOneMonsters);
    const template = pool[Math.floor(Math.random() * pool.length)];
    this.#spawnFromTemplate(template, false);
    bestiary.recordEncounter(template.id);
    this.corruption.onEncounter();
  }

  spawnBoss() {
    this.#spawnFromTemplate(ChapterOneBoss, true);
    this.bossActive = true;
  }

  #spawnFromTemplate(template, isBoss) {
    const edge = Math.floor(Math.random() * 3);
    let x, y;
    if (edge === 0) { x = Math.random() * this.width; y = 0; }
    else if (edge === 1) { x = 0; y = Math.random() * this.height * 0.6; }
    else { x = this.width; y = Math.random() * this.height * 0.6; }

    this.enemies.push({
      id: crypto.randomUUID(),
      templateId: template.id,
      name: template.name,
      emoji: template.emoji,
      isBoss,
      pos: { x, y },
      health: template.maxHealth,
      maxHealth: template.maxHealth,
      attack: template.attack,
      speed: isBoss ? 0.15 : 0.35
    });
  }

  movePlayer(deltaMs) {
    const speed = 0.3;
    if (this.moveState.up) this.playerPos.y -= speed * deltaMs;
    if (this.moveState.down) this.playerPos.y += speed * deltaMs;
    if (this.moveState.left) this.playerPos.x -= speed * deltaMs;
    if (this.moveState.right) this.playerPos.x += speed * deltaMs;

    this.playerPos.x = Math.max(10, Math.min(this.width - 10, this.playerPos.x));
    this.playerPos.y = Math.max(10, Math.min(this.height - 10, this.playerPos.y));
  }

  moveEnemiesAndResolveContact(deltaMs) {
    for (const enemy of this.enemies) {
      const dx = this.playerPos.x - enemy.pos.x;
      const dy = this.playerPos.y - enemy.pos.y;
      const dist = Math.hypot(dx, dy) || 1;

      enemy.pos.x += (dx / dist) * enemy.speed * deltaMs;
      enemy.pos.y += (dy / dist) * enemy.speed * deltaMs;

      if (dist < 22) {
        const dmgPerMs = (enemy.attack * 0.01) / 1000 * deltaMs * 1000; // 초당 attack*0.01 비율로 접촉 피해
        this.playerHealth = Math.max(0, this.playerHealth - enemy.attack * 0.002 * deltaMs);
      }
    }
  }

  canUseSkill(skillId) {
    const lastUsed = this.skillCooldowns.get(skillId) ?? -Infinity;
    const skill = BaseSkills[skillId];
    return performance.now() - lastUsed >= skill.cooldownMs;
  }

  useSkill(skillId) {
    if (!this.canUseSkill(skillId)) return false;
    const skill = BaseSkills[skillId];
    this.skillCooldowns.set(skillId, performance.now());

    let closest = null;
    let closestDist = Infinity;
    for (const enemy of this.enemies) {
      const dist = Math.hypot(enemy.pos.x - this.playerPos.x, enemy.pos.y - this.playerPos.y);
      if (dist <= skill.range && dist < closestDist) {
        closest = enemy;
        closestDist = dist;
      }
    }

    if (closest) {
      closest.health -= (skill.damage + playerOrigin.attack * 0.3);
      if (closest.health <= 0) {
        this.#onEnemyDefeated(closest);
      }
    }

    return true;
  }

  #onEnemyDefeated(enemy) {
    this.enemies = this.enemies.filter(e => e.id !== enemy.id);
    bestiary.recordPurified(enemy.templateId);
    purificationInventory.addBeads(enemy.isBoss ? 10 : (1 + Math.floor(Math.random() * 2)));

    if (enemy.isBoss) {
      this.bossActive = false;
      this.isOver = true;
      GameEventBus.publish(ChapterEvents.CHAPTER_CLEARED, { chapter: ChapterType.FORGOTTEN_GRASSLANDS });
    } else {
      this.killCount += 1;
      if (this.killCount >= 5) this.bossUnlocked = true;
    }
  }
}

      field.movePlayer(deltaMs);
      field.moveEnemiesAndResolveContact(deltaMs);
      field.corruption.tick(deltaMs / 1000);

      if (field.corruption.isOverloaded) {
        purificationInventory.applyOverloadPenalty();
        endExploration("오염도가 폭주했다! 강제로 귀환한다. (정화구 절반 손실)");
        return;
      }

      if (field.playerHealth <= 0) {
        endExploration("잡초가 쓰러졌다... 기지로 돌아간다.");
        return;
      }

      spawnTimerMs += deltaMs;
      const spawnInterval = field.bossActive ? Infinity : 1800;
      if (spawnTimerMs > spawnInterval && field.enemies.length < 5 && !field.bossActive) {
        field.spawnRegularEnemy();
        spawnTimerMs = 0;
      }
    }

    renderField();
    if (!field.isOver) rafId = requestAnimationFrame(fieldTick);
  }

  function renderField() {
    const sprite = document.getElementById("field-player-sprite");
    sprite.style.left = `${field.playerPos.x}px`;
    sprite.style.top = `${field.playerPos.y}px`;

    const hpOuter = document.getElementById("field-player-hp-outer");
    hpOuter.style.left = `${field.playerPos.x - 18}px`;
    hpOuter.style.top = `${field.playerPos.y - 22}px`;
    hpOuter.style.width = "36px";
    document.getElementById("field-player-hp-fill").style.width =
      `${Math.max(0, field.playerHealth / field.playerMaxHealth) * 100}%`;

    document.getElementById("field-corruption-fill").style.width = `${field.corruption.value}%`;
    document.getElementById("field-bead-count").textContent = purificationInventory.beadCount;
    document.getElementById("field-orb-count").textContent = purificationInventory.orbCount;

    const arenaEl = document.getElementById("field-arena");
    arenaEl.querySelectorAll(".field-enemy-sprite, .field-enemy-hp-outer").forEach(el => el.remove());

    for (const enemy of field.enemies) {
      const es = document.createElement("div");
      es.className = "field-enemy-sprite";
      es.textContent = enemy.emoji;
      es.style.left = `${enemy.pos.x}px`;
      es.style.top = `${enemy.pos.y}px`;
      if (enemy.isBoss) es.style.fontSize = "42px";
      arenaEl.appendChild(es);

      const hpOuterEl = document.createElement("div");
      hpOuterEl.className = "field-enemy-hp-outer";
      hpOuterEl.style.width = enemy.isBoss ? "50px" : "24px";
      hpOuterEl.style.left = `${enemy.pos.x - (enemy.isBoss ? 25 : 12)}px`;
      hpOuterEl.style.top = `${enemy.pos.y - (enemy.isBoss ? 30 : 17)}px`;
      const hpFillEl = document.createElement("div");
      hpFillEl.className = enemy.isBoss ? "field-boss-hp-fill" : "field-enemy-hp-fill";
      hpFillEl.style.height = "100%";
      hpFillEl.style.width = `${Math.max(0, enemy.health / enemy.maxHealth) * 100}%`;
      hpOuterEl.appendChild(hpFillEl);
      arenaEl.appendChild(hpOuterEl);
    }

    for (const skillId of Object.keys(BaseSkills)) {
      document.getElementById(`field-skill-${skillId}`).disabled = field.isOver || !field.canUseSkill(skillId);
    }

    document.getElementById("btn-use-orb").disabled = field.isOver || purificationInventory.orbCount <= 0;
    document.getElementById("btn-challenge-boss").disabled = field.isOver || !field.bossUnlocked || field.bossActive;
  }

  function bindHold(buttonId, direction) {
    const btn = document.getElementById(buttonId);
    const start = () => { if (field) field.moveState[direction] = true; };
    const stop = () => { if (field) field.moveState[direction] = false; };
    btn.addEventListener("touchstart", start);
    btn.addEventListener("touchend", stop);
    btn.addEventListener("mousedown", start);
    btn.addEventListener("mouseup", stop);
    btn.addEventListener("mouseleave", stop);
  }
  bindHold("field-dpad-up", "up");
  bindHold("field-dpad-down", "down");
  bindHold("field-dpad-left", "left");
  bindHold("field-dpad-right", "right");

  for (const skillId of Object.keys(BaseSkills)) {
    document.getElementById(`field-skill-${skillId}`).addEventListener("click", () => {
      if (field && !field.isOver) field.useSkill(skillId);
    });
  }

  document.getElementById("btn-use-orb").addEventListener("click", () => {
    if (field) field.corruption.reduceWithOrb(purificationInventory);
  });

  document.getElementById("btn-challenge-boss").addEventListener("click", () => {
    if (field && field.bossUnlocked && !field.bossActive) {
      field.spawnBoss();
      document.getElementById("field-log-line").textContent = "절망의 뿌리 갈퀴가 나타났다!";
    }
  });

  GameEventBus.subscribe(ChapterEvents.CHAPTER_CLEARED, () => {
    setTimeout(() => {
      endExploration("초원이 정화되었다! 챕터 1 클리어.");
      GameManager.instance.advanceToChapter(ChapterType.MUSHROOM_FOREST);
    }, 300);
  });

  // 진화 배너 표시
  GameEventBus.subscribe(ChapterEvents.EVOLUTION_ADVANCED, (e) => {
    evoBanner.textContent = `✨ 진화! ${e.name}(으)로 성장했다.`;
    evoBanner.style.display = "block";
    setTimeout(() => { evoBanner.style.display = "none"; }, 3000);
  });

  // 2년 공백 대사가 끝나면(=seen_two_year_timeskip 플래그가 세팅되면) 챕터1 입장 패널을 띄움.
  // 기존 Part 3 코드를 전혀 건드리지 않고, 이벤트 구독만으로 연결.
  GameEventBus.subscribe(CoreEvents.STORY_FLAG_SET, (e) => {
    if (e.flagName === "seen_two_year_timeskip") {
      showChapter1Entry();
    }
  });

  // 이미 그 플래그가 세팅된 상태로 게임을 다시 열었을 경우 대비
  window.addEventListener("load", () => {
    if (storyFlags.has("seen_two_year_timeskip") && !storyFlags.has("cleared_chapter1")) {
      showChapter1Entry();
    }
  });
})();
</script>
</body>
</html>
