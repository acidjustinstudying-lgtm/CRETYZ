/* ============================================================
   CRETYZ v2 - Part 1 (Core 시스템 + 인큐베이션)

const GrowthStyle = Object.freeze({
  OFFENSIVE: "OFFENSIVE",
  DEFENSIVE: "DEFENSIVE",
  BALANCED: "BALANCED"
});

const ChapterType = Object.freeze({
  FORGOTTEN_GRASSLANDS: 1,
  MUSHROOM_FOREST: 2,
  SCORCHED_DESERT: 3,
  FROST_VALLEY: 4,
  CRIMSON_VOLCANO: 5,
  FLORIA_CAPITAL: 6,
  SKY_GARDEN: 7,
  CANYON_OF_DEATH: 8,
  FINAL_BATTLEGROUND: 9,
  WORLD_TREE: 10
});

const StatusEffectType = Object.freeze({
  NONE: 0,
  BURN: 1 << 0,
  FREEZE: 1 << 1,
  POISON: 1 << 2,
  SLOW: 1 << 3,
  STUN: 1 << 4
});

class GameEventBus {
  static #subscribers = new Map();

  static subscribe(eventName, handler) {
    if (!this.#subscribers.has(eventName)) this.#subscribers.set(eventName, []);
    this.#subscribers.get(eventName).push(handler);
  }

  static unsubscribe(eventName, handler) {
    if (!this.#subscribers.has(eventName)) return;
    const list = this.#subscribers.get(eventName);
    const idx = list.indexOf(handler);
    if (idx !== -1) list.splice(idx, 1);
    if (list.length === 0) this.#subscribers.delete(eventName);
  }

  static publish(eventName, payload) {
    if (!this.#subscribers.has(eventName)) return;
    const snapshot = [...this.#subscribers.get(eventName)];
    for (const handler of snapshot) {
      try { handler(payload); }
      catch (err) { console.error(`[GameEventBus] ${eventName} 처리 중 예외:`, err); }
    }
  }
}

const CoreEvents = Object.freeze({
  DAY_ADVANCED: "OnDayAdvanced",
  ORIGIN_BORN: "OnOriginBorn",
  CHAPTER_CHANGED: "OnChapterChanged",
  STORY_FLAG_SET: "OnStoryFlagSet"
});

class GameManager {
  static #instance = null;
  #currentChapter = ChapterType.FORGOTTEN_GRASSLANDS;

  static get instance() {
    if (!this.#instance) this.#instance = new GameManager();
    return this.#instance;
  }

  get currentChapter() { return this.#currentChapter; }

  advanceToChapter(chapter) {
    this.#currentChapter = chapter;
    GameEventBus.publish(CoreEvents.CHAPTER_CHANGED, { chapter });
  }
}

class StoryFlags {
  static SAVE_KEY = "cretyz_v2_story_flags";

  constructor() { this.flags = new Set(); }
  has(flagName) { return this.flags.has(flagName); }

  set(flagName) {
    if (this.flags.has(flagName)) return;
    this.flags.add(flagName);
    GameEventBus.publish(CoreEvents.STORY_FLAG_SET, { flagName });
    this.save();
  }

  toJSON() { return { flags: Array.from(this.flags) }; }
  static fromJSON(json) { const s = new StoryFlags(); s.flags = new Set(json.flags); return s; }

  save() {
    try { localStorage.setItem(StoryFlags.SAVE_KEY, JSON.stringify(this.toJSON())); return true; }
    catch (err) { console.error("[StoryFlags] 저장 실패:", err); return false; }
  }

  static load() {
    try {
      const raw = localStorage.getItem(StoryFlags.SAVE_KEY);
      if (!raw) return null;
      return StoryFlags.fromJSON(JSON.parse(raw));
    } catch (err) { console.error("[StoryFlags] 로드 실패:", err); return null; }
  }
}

class IncubationState {
  static SAVE_KEY = "cretyz_v2_incubation";
  static TOTAL_DAYS = 5;

  constructor() {
    this.dayCount = 0;
    this.waterDays = 0;
    this.sunlightDays = 0;
    this.todayChoiceMade = false;
    this.isBorn = false;
  }

  get isComplete() { return this.dayCount >= IncubationState.TOTAL_DAYS; }

  makeChoice(chooseWater) {
    if (this.isComplete || this.todayChoiceMade) return false;
    if (chooseWater) this.waterDays += 1; else this.sunlightDays += 1;
    this.todayChoiceMade = true;
    this.save();
    return true;
  }

  advanceDay() {
    if (!this.todayChoiceMade && !this.isComplete) return false;

    this.dayCount += 1;
    this.todayChoiceMade = false;
    GameEventBus.publish(CoreEvents.DAY_ADVANCED, { dayCount: this.dayCount });

    if (this.isComplete && !this.isBorn) {
      this.isBorn = true;
      const finalStyle = this.#computeFinalStyle();
      GameEventBus.publish(CoreEvents.ORIGIN_BORN, { style: finalStyle });
    }
    this.save();
    return true;
  }

  #computeFinalStyle() {
    const total = this.waterDays + this.sunlightDays;
    if (total === 0) return GrowthStyle.BALANCED;
    const waterRatio = this.waterDays / total;
    if (waterRatio >= 0.65) return GrowthStyle.OFFENSIVE;
    if (waterRatio <= 0.35) return GrowthStyle.DEFENSIVE;
    return GrowthStyle.BALANCED;
  }

  toJSON() {
    return {
      dayCount: this.dayCount, waterDays: this.waterDays, sunlightDays: this.sunlightDays,
      todayChoiceMade: this.todayChoiceMade, isBorn: this.isBorn
    };
  }

  static fromJSON(json) {
    const s = new IncubationState();
    Object.assign(s, json);
    return s;
  }

  save() {
    try { localStorage.setItem(IncubationState.SAVE_KEY, JSON.stringify(this.toJSON())); return true; }
    catch (err) { console.error("[IncubationState] 저장 실패:", err); return false; }
  }

  static load() {
    try {
      const raw = localStorage.getItem(IncubationState.SAVE_KEY);
      if (!raw) return null;
      return IncubationState.fromJSON(JSON.parse(raw));
    } catch (err) { console.error("[IncubationState] 로드 실패:", err); return null; }
  }
}

/* ============================================================
   CRETYZ v2 - Part 2 (오리진 데이터 + 진화 + 대화 시스템 + 첫 만남)

const ChapterEvents = Object.freeze({
  CORRUPTION_CHANGED: "OnCorruptionChanged",
  CORRUPTION_OVERLOAD: "OnCorruptionOverload",
  EVOLUTION_ADVANCED: "OnEvolutionAdvanced",
  BEAD_COLLECTED: "OnBeadCollected",
  ORB_CRAFTED: "OnOrbCrafted",
  MONSTER_ENCOUNTERED: "OnMonsterEncountered",
  MONSTER_PURIFIED: "OnMonsterPurified",
  CHAPTER_CLEARED: "OnChapterCleared"
});

// 3루트 진화 테이블. 1단계=탄생 직후, 2단계=챕터3+, 3단계=챕터8+ (되돌릴 수 없음)
const OriginEvolutionTable = {
  [GrowthStyle.OFFENSIVE]: {
    1: { name: "잡초", maxHealth: 30, attack: 8, defense: 2 },
    2: { name: "심연의 포식자", maxHealth: 55, attack: 16, defense: 4 },
    3: { name: "세계수의 대변자·흑", maxHealth: 95, attack: 30, defense: 8 }
  },
  [GrowthStyle.DEFENSIVE]: {
    1: { name: "잡초", maxHealth: 45, attack: 4, defense: 6 },
    2: { name: "성스러운 수호자", maxHealth: 85, attack: 8, defense: 13 },
    3: { name: "세계수의 대변자·백", maxHealth: 150, attack: 14, defense: 24 }
  },
  [GrowthStyle.BALANCED]: {
    1: { name: "잡초", maxHealth: 36, attack: 6, defense: 4 },
    2: { name: "에덴의 정원사", maxHealth: 68, attack: 12, defense: 8 },
    3: { name: "세계수의 의지", maxHealth: 118, attack: 21, defense: 15 }
  }
};

class OriginRuntimeState {
  static SAVE_KEY = "cretyz_v2_origin";

  constructor(growthStyle) {
    this.growthStyle = growthStyle;
    this.evolutionStage = 1;
    const base = OriginEvolutionTable[growthStyle][1];
    this.name = base.name;
    this.maxHealth = base.maxHealth;
    this.currentHealth = base.maxHealth;
    this.attack = base.attack;
    this.defense = base.defense;
  }

  // 챕터 번호에 따라 2차/3차 진화 여부를 확인하고, 조건 충족 시 스탯을 갱신한다.
  checkEvolution(currentChapterNumber) {
    let newStage = this.evolutionStage;
    if (currentChapterNumber >= 8 && newStage < 3) newStage = 3;
    else if (currentChapterNumber >= 3 && newStage < 2) newStage = 2;
    if (newStage === this.evolutionStage) return;

    const healthRatio = this.maxHealth > 0 ? this.currentHealth / this.maxHealth : 1;
    this.evolutionStage = newStage;
    const table = OriginEvolutionTable[this.growthStyle][newStage];
    this.name = table.name;
    this.maxHealth = table.maxHealth;
    this.attack = table.attack;
    this.defense = table.defense;
    this.currentHealth = Math.round(this.maxHealth * healthRatio);
    this.save();
    GameEventBus.publish(ChapterEvents.EVOLUTION_ADVANCED, {
      style: this.growthStyle, stage: newStage, name: this.name
    });
  }

  toJSON() {
    return {
      growthStyle: this.growthStyle, evolutionStage: this.evolutionStage, name: this.name,
      maxHealth: this.maxHealth, currentHealth: this.currentHealth, attack: this.attack, defense: this.defense
    };
  }

  static fromJSON(json) {
    const state = new OriginRuntimeState(json.growthStyle);
    Object.assign(state, json);
    return state;
  }

  save() {
    try { localStorage.setItem(OriginRuntimeState.SAVE_KEY, JSON.stringify(this.toJSON())); return true; }
    catch (err) { console.error("[OriginRuntimeState] 저장 실패:", err); return false; }
  }

  static load() {
    try {
      const raw = localStorage.getItem(OriginRuntimeState.SAVE_KEY);
      if (!raw) return null;
      return OriginRuntimeState.fromJSON(JSON.parse(raw));
    } catch (err) { console.error("[OriginRuntimeState] 로드 실패:", err); return null; }
  }
}

    #dialogue-clear { clear:both; }
  `;
  document.head.appendChild(style);

  const overlay = document.createElement("div");
  overlay.id = "dialogue-overlay";
  overlay.innerHTML = `
    <div id="dialogue-portrait"></div>
    <div id="dialogue-speaker"></div>
    <div id="dialogue-text"></div>
    <div id="dialogue-clear"></div>
    <button id="dialogue-next-btn">다음 ▶</button>
  `;
  document.body.appendChild(overlay);

  let activeScene = null;
  let activeLineIndex = 0;
  let onSceneEndCallback = null;

  window.playDialogue = function playDialogue(sceneId, onEnd) {
    const scene = StoryScenes[sceneId];
    if (!scene) { console.warn(`[Dialogue] 존재하지 않는 장면: ${sceneId}`); return; }
    activeScene = scene;
    activeLineIndex = 0;
    onSceneEndCallback = onEnd || null;
    overlay.style.display = "block";
    renderCurrentLine();
  };

  function renderCurrentLine() {
    const line = activeScene[activeLineIndex];
    document.getElementById("dialogue-portrait").textContent = line.speaker.portrait;
    document.getElementById("dialogue-speaker").textContent = line.speaker.name;
    document.getElementById("dialogue-text").textContent = line.text;
  }

  document.getElementById("dialogue-next-btn").addEventListener("click", () => {
    activeLineIndex += 1;
    if (activeLineIndex >= activeScene.length) {
      overlay.style.display = "none";
      const cb = onSceneEndCallback;
      activeScene = null;
      onSceneEndCallback = null;
      if (cb) cb();
      return;
    }
    renderCurrentLine();
  });
})();

  playerOrigin.save();

/* ============================================================
   CRETYZ v2 - Part 3 (첫 전투: 브롤스타즈식 직접조작)
   ============================================================ */

const BattleEvents = Object.freeze({
  BATTLE_STARTED: "OnBattleStarted",
  PLAYER_DEFEATED: "OnPlayerDefeated",
  ENEMY_KILLED: "OnEnemyKilled"
});

const BaseSkills = {
  SEED_SHOT:  { id: "SEED_SHOT",  label: "🌰 씨앗발사", cooldownMs: 1200, range: 220, damage: 6 },
  VINE_BIND:  { id: "VINE_BIND",  label: "🌿 덩굴속박", cooldownMs: 2500, range: 120, damage: 4, statusEffect: StatusEffectType.SLOW },
  ICE_POWDER: { id: "ICE_POWDER", label: "❄️ 얼음가루", cooldownMs: 3000, range: 160, damage: 5, statusEffect: StatusEffectType.FREEZE },
  FLAME_SHOT: { id: "FLAME_SHOT", label: "🔥 불꽃발사", cooldownMs: 2000, range: 200, damage: 8, statusEffect: StatusEffectType.BURN }
};

class BattleArena {
  constructor(widthPx, heightPx) {
    this.width = widthPx;
    this.height = heightPx;
    this.playerPos = { x: widthPx / 2, y: heightPx * 0.8 };
    this.playerHealth = 30;
    this.playerMaxHealth = 30;
    this.enemies = [];
    this.skillCooldowns = new Map();
    this.isOver = false;
    this.moveState = { up: false, down: false, left: false, right: false };
  }

  spawnEnemy() {
    const edge = Math.floor(Math.random() * 3);
    let x, y;
    if (edge === 0) { x = Math.random() * this.width; y = 0; }
    else if (edge === 1) { x = 0; y = Math.random() * this.height * 0.6; }
    else { x = this.width; y = Math.random() * this.height * 0.6; }
    this.enemies.push({ id: crypto.randomUUID(), pos: { x, y }, health: 10, maxHealth: 10, speed: 0.4 });
  }

  movePlayer(deltaMs) {
    const speed = 0.3;
    if (this.moveState.up) this.playerPos.y -= speed * deltaMs;
    if (this.moveState.down) this.playerPos.y += speed * deltaMs;
    if (this.moveState.left) this.playerPos.x -= speed * deltaMs;
    if (this.moveState.right) this.playerPos.x += speed * deltaMs;
    this.playerPos.x = Math.max(10, Math.min(this.width - 10, this.playerPos.x));
    this.playerPos.y = Math.max(10, Math.min(this.height - 10, this.playerPos.y));
  }

  moveEnemies(deltaMs) {
    for (const enemy of this.enemies) {
      const dx = this.playerPos.x - enemy.pos.x;
      const dy = this.playerPos.y - enemy.pos.y;
      const dist = Math.hypot(dx, dy) || 1;
      enemy.pos.x += (dx / dist) * enemy.speed * deltaMs;
      enemy.pos.y += (dy / dist) * enemy.speed * deltaMs;
      if (dist < 22) this.playerHealth = Math.max(0, this.playerHealth - 0.02 * deltaMs);
    }
  }

  canUseSkill(skillId) {
    const lastUsed = this.skillCooldowns.get(skillId) ?? -Infinity;
    return performance.now() - lastUsed >= BaseSkills[skillId].cooldownMs;
  }

  useSkill(skillId) {
    if (!this.canUseSkill(skillId)) return false;
    const skill = BaseSkills[skillId];
    this.skillCooldowns.set(skillId, performance.now());

    let closest = null, closestDist = Infinity;
    for (const enemy of this.enemies) {
      const dist = Math.hypot(enemy.pos.x - this.playerPos.x, enemy.pos.y - this.playerPos.y);
      if (dist <= skill.range && dist < closestDist) { closest = enemy; closestDist = dist; }
    }
    if (closest) {
      closest.health -= skill.damage;
      if (closest.health <= 0) {
        this.enemies = this.enemies.filter(e => e.id !== closest.id);
        GameEventBus.publish(BattleEvents.ENEMY_KILLED, {});
      }
    }
    return true;
  }
}

class PurificationInventory {
  static SAVE_KEY = "cretyz_v2_purification";

  constructor() { this.beadCount = 0; this.orbCount = 0; }

  addBeads(amount) {
    this.beadCount += amount;
    GameEventBus.publish(ChapterEvents.BEAD_COLLECTED, { amount, total: this.beadCount });
    while (this.beadCount >= 5) {
      this.beadCount -= 5;
      this.orbCount += 1;
      GameEventBus.publish(ChapterEvents.ORB_CRAFTED, { total: this.orbCount });
    }
    this.save();
  }

  consumeOrb() {
    if (this.orbCount <= 0) return false;
    this.orbCount -= 1;
    this.save();
    return true;
  }

  applyOverloadPenalty() {
    this.orbCount = Math.floor(this.orbCount / 2);
    this.beadCount = 0;
    this.save();
  }

  toJSON() { return { beadCount: this.beadCount, orbCount: this.orbCount }; }
  static fromJSON(json) { const i = new PurificationInventory(); Object.assign(i, json); return i; }

  save() {
    try { localStorage.setItem(PurificationInventory.SAVE_KEY, JSON.stringify(this.toJSON())); return true; }
    catch (err) { console.error("[PurificationInventory] 저장 실패:", err); return false; }
  }

  static load() {
    try {
      const raw = localStorage.getItem(PurificationInventory.SAVE_KEY);
      if (!raw) return null;
      return PurificationInventory.fromJSON(JSON.parse(raw));
    } catch (err) { console.error("[PurificationInventory] 로드 실패:", err); return null; }
  }
}

class CorruptionGaugeState {
  static MAX_VALUE = 100;
  static PASSIVE_RISE_PER_SEC = 0.8;
  static RISE_PER_ENCOUNTER = 5;
  static REDUCE_PER_ORB = 25;

  constructor() { this.value = 0; this.isOverloaded = false; }

  tick(deltaSec) { if (!this.isOverloaded) this.#add(CorruptionGaugeState.PASSIVE_RISE_PER_SEC * deltaSec); }
  onEncounter() { this.#add(CorruptionGaugeState.RISE_PER_ENCOUNTER); }

  reduceWithOrb(purificationInventory) {
    if (this.isOverloaded) return false;
    if (!purificationInventory.consumeOrb()) return false;
    this.value = Math.max(0, this.value - CorruptionGaugeState.REDUCE_PER_ORB);
    GameEventBus.publish(ChapterEvents.CORRUPTION_CHANGED, { value: this.value });
    return true;
  }

  #add(amount) {
    if (this.isOverloaded) return;
    this.value = Math.min(CorruptionGaugeState.MAX_VALUE, this.value + amount);
    GameEventBus.publish(ChapterEvents.CORRUPTION_CHANGED, { value: this.value });
    if (this.value >= CorruptionGaugeState.MAX_VALUE) {
      this.isOverloaded = true;
      GameEventBus.publish(ChapterEvents.CORRUPTION_OVERLOAD, {});
    }
  }
}

// 배양으로 익힌 스킬까지 포함해 "지금 쓸 수 있는 모든 스킬"을 계산하는 헬퍼.
// PurifiedFormData(Part5)는 이 파일 뒤쪽에서 정의되지만, 함수 선언은 호이스팅되어
// 실제 호출 시점(전투 중)에는 이미 존재하므로 문제없다.
function getAvailableSkillIds() {
  const ids = Object.keys(BaseSkills);
  for (const monsterId of Object.keys(PurifiedFormData)) {
    const skillDef = PurifiedFormData[monsterId].SKILL;
    if (breedingInventory.learnedSkillIds.includes(skillDef.id)) ids.push(skillDef.id);
  }
  return ids;
}

function getSkillDefinition(skillId) {
  if (BaseSkills[skillId]) return BaseSkills[skillId];
  for (const monsterId of Object.keys(PurifiedFormData)) {
    if (PurifiedFormData[monsterId].SKILL.id === skillId) return PurifiedFormData[monsterId].SKILL;
  }
  return null;
}

class FieldArena {
  constructor(widthPx, heightPx) {
    this.width = widthPx;
    this.height = heightPx;
    this.playerPos = { x: widthPx / 2, y: heightPx * 0.8 };
    this.playerMaxHealth = playerOrigin.maxHealth;
    this.playerHealth = playerOrigin.currentHealth > 0 ? playerOrigin.currentHealth : playerOrigin.maxHealth;
    this.enemies = [];
    this.skillCooldowns = new Map();
    this.moveState = { up: false, down: false, left: false, right: false };
    this.corruption = new CorruptionGaugeState();
    this.killCount = 0;
    this.bossUnlocked = false;
    this.bossActive = false;
    this.isOver = false;
  }

  spawnRegularEnemy() {
    const pool = Object.values(ChapterOneMonsters);
    const template = pool[Math.floor(Math.random() * pool.length)];
    this.#spawnFromTemplate(template, false);
    bestiary.recordEncounter(template.id);
    this.corruption.onEncounter();
  }

  spawnBoss() { this.#spawnFromTemplate(ChapterOneBoss, true); this.bossActive = true; }

  #spawnFromTemplate(template, isBoss) {
    const edge = Math.floor(Math.random() * 3);
    let x, y;
    if (edge === 0) { x = Math.random() * this.width; y = 0; }
    else if (edge === 1) { x = 0; y = Math.random() * this.height * 0.6; }
    else { x = this.width; y = Math.random() * this.height * 0.6; }

    this.enemies.push({
      id: crypto.randomUUID(), templateId: template.id, name: template.name, emoji: template.emoji,
      isBoss, pos: { x, y }, health: template.maxHealth, maxHealth: template.maxHealth,
      attack: template.attack, speed: isBoss ? 0.15 : 0.35
    });
  }

  movePlayer(deltaMs) {
    const speed = 0.3;
    if (this.moveState.up) this.playerPos.y -= speed * deltaMs;
    if (this.moveState.down) this.playerPos.y += speed * deltaMs;
    if (this.moveState.left) this.playerPos.x -= speed * deltaMs;
    if (this.moveState.right) this.playerPos.x += speed * deltaMs;
    this.playerPos.x = Math.max(10, Math.min(this.width - 10, this.playerPos.x));
    this.playerPos.y = Math.max(10, Math.min(this.height - 10, this.playerPos.y));
  }

  moveEnemiesAndResolveContact(deltaMs) {
    for (const enemy of this.enemies) {
      const dx = this.playerPos.x - enemy.pos.x;
      const dy = this.playerPos.y - enemy.pos.y;
      const dist = Math.hypot(dx, dy) || 1;
      enemy.pos.x += (dx / dist) * enemy.speed * deltaMs;
      enemy.pos.y += (dy / dist) * enemy.speed * deltaMs;
      if (dist < 22) this.playerHealth = Math.max(0, this.playerHealth - enemy.attack * 0.002 * deltaMs);
    }
  }

  canUseSkill(skillId) {
    const def = getSkillDefinition(skillId);
    if (!def) return false;
    const lastUsed = this.skillCooldowns.get(skillId) ?? -Infinity;
    return performance.now() - lastUsed >= def.cooldownMs;
  }

  useSkill(skillId) {
    if (!this.canUseSkill(skillId)) return false;
    const skill = getSkillDefinition(skillId);
    this.skillCooldowns.set(skillId, performance.now());

    let closest = null, closestDist = Infinity;
    for (const enemy of this.enemies) {
      const dist = Math.hypot(enemy.pos.x - this.playerPos.x, enemy.pos.y - this.playerPos.y);
      if (dist <= skill.range && dist < closestDist) { closest = enemy; closestDist = dist; }
    }
    if (closest) {
      closest.health -= (skill.damage + playerOrigin.attack * 0.3);
      if (closest.health <= 0) this.#onEnemyDefeated(closest);
    }
    return true;
  }

  #onEnemyDefeated(enemy) {
    this.enemies = this.enemies.filter(e => e.id !== enemy.id);
    bestiary.recordPurified(enemy.templateId);
    purificationInventory.addBeads(enemy.isBoss ? 10 : (1 + Math.floor(Math.random() * 2)));

    if (enemy.isBoss) {
      this.bossActive = false;
      this.isOver = true;
      GameEventBus.publish(ChapterEvents.CHAPTER_CLEARED, { chapter: ChapterType.FORGOTTEN_GRASSLANDS });
    } else {
      this.killCount += 1;
      if (this.killCount >= 5) this.bossUnlocked = true;
    }
  }
}

  document.body.appendChild(evoBanner);

  let field = null, lastFrameTime = null, spawnTimerMs = 0, rafId = null;

  function showChapter1Entry() { entryPanel.style.display = "block"; }

  document.getElementById("btn-enter-chapter1").addEventListener("click", () => {
    entryPanel.style.display = "none";
    startExploration();
  });

  function renderSkillButtons() {
    const container = document.getElementById("field-skill-buttons");
    container.innerHTML = "";
    for (const skillId of getAvailableSkillIds()) {
      const def = getSkillDefinition(skillId);
      const btn = document.createElement("button");
      btn.id = `field-skill-${skillId}`;
      btn.textContent = def.label;
      btn.addEventListener("click", () => { if (field && !field.isOver) field.useSkill(skillId); });
      container.appendChild(btn);
    }
  }

  function startExploration() {
    wrap.style.display = "block";
    field = new FieldArena(380, 340);
    renderSkillButtons();
    lastFrameTime = performance.now();
    spawnTimerMs = 0;
    document.getElementById("field-log-line").textContent = "초원을 탐색한다...";
    rafId = requestAnimationFrame(fieldTick);
  }

  function endExploration(message) {
    field.isOver = true;
    cancelAnimationFrame(rafId);
    playerOrigin.currentHealth = Math.max(1, Math.round(field.playerHealth));
    playerOrigin.save();
    document.getElementById("field-log-line").textContent = message;
    setTimeout(() => { wrap.style.display = "none"; }, 1800);
  }

  function fieldTick(now) {
    const deltaMs = now - lastFrameTime;
    lastFrameTime = now;

    if (!field.isOver) {
      field.movePlayer(deltaMs);
      field.moveEnemiesAndResolveContact(deltaMs);
      field.corruption.tick(deltaMs / 1000);

      if (field.corruption.isOverloaded) {
        purificationInventory.applyOverloadPenalty();
        endExploration("오염도가 폭주했다! 강제로 귀환한다. (정화구 절반 손실)");
        return;
      }
      if (field.playerHealth <= 0) { endExploration("잡초가 쓰러졌다... 기지로 돌아간다."); return; }

      spawnTimerMs += deltaMs;
      const spawnInterval = field.bossActive ? Infinity : 1800;
      if (spawnTimerMs > spawnInterval && field.enemies.length < 5 && !field.bossActive) {
        field.spawnRegularEnemy();
        spawnTimerMs = 0;
      }
    }
    renderField();
    if (!field.isOver) rafId = requestAnimationFrame(fieldTick);
  }

  function renderField() {
    const sprite = document.getElementById("field-player-sprite");
    sprite.style.left = `${field.playerPos.x}px`;
    sprite.style.top = `${field.playerPos.y}px`;

    const hpOuter = document.getElementById("field-player-hp-outer");
    hpOuter.style.left = `${field.playerPos.x - 18}px`;
    hpOuter.style.top = `${field.playerPos.y - 22}px`;
    hpOuter.style.width = "36px";
    document.getElementById("field-player-hp-fill").style.width = `${Math.max(0, field.playerHealth / field.playerMaxHealth) * 100}%`;

    document.getElementById("field-corruption-fill").style.width = `${field.corruption.value}%`;
    document.getElementById("field-bead-count").textContent = purificationInventory.beadCount;
    document.getElementById("field-orb-count").textContent = purificationInventory.orbCount;

    const arenaEl = document.getElementById("field-arena");
    arenaEl.querySelectorAll(".field-enemy-sprite, .field-enemy-hp-outer").forEach(el => el.remove());

    for (const enemy of field.enemies) {
      const es = document.createElement("div");
      es.className = "field-enemy-sprite";
      es.textContent = enemy.emoji;
      es.style.left = `${enemy.pos.x}px`;
      es.style.top = `${enemy.pos.y}px`;
      if (enemy.isBoss) es.style.fontSize = "42px";
      arenaEl.appendChild(es);

      const hpOuterEl = document.createElement("div");
      hpOuterEl.className = "field-enemy-hp-outer";
      hpOuterEl.style.width = enemy.isBoss ? "50px" : "24px";
      hpOuterEl.style.left = `${enemy.pos.x - (enemy.isBoss ? 25 : 12)}px`;
      hpOuterEl.style.top = `${enemy.pos.y - (enemy.isBoss ? 30 : 17)}px`;
      const hpFillEl = document.createElement("div");
      hpFillEl.className = enemy.isBoss ? "field-boss-hp-fill" : "field-enemy-hp-fill";
      hpFillEl.style.width = `${Math.max(0, enemy.health / enemy.maxHealth) * 100}%`;
      hpOuterEl.appendChild(hpFillEl);
      arenaEl.appendChild(hpOuterEl);
    }

    for (const skillId of getAvailableSkillIds()) {
      const btn = document.getElementById(`field-skill-${skillId}`);
      if (btn) btn.disabled = field.isOver || !field.canUseSkill(skillId);
    }

    document.getElementById("btn-use-orb").disabled = field.isOver || purificationInventory.orbCount <= 0;
    document.getElementById("btn-challenge-boss").disabled = field.isOver || !field.bossUnlocked || field.bossActive;
  }

  function bindHold(buttonId, direction) {
    const btn = document.getElementById(buttonId);
    const start = () => { if (field) field.moveState[direction] = true; };
    const stop = () => { if (field) field.moveState[direction] = false; };
    btn.addEventListener("touchstart", start);
    btn.addEventListener("touchend", stop);
    btn.addEventListener("mousedown", start);
    btn.addEventListener("mouseup", stop);
    btn.addEventListener("mouseleave", stop);
  }
  bindHold("field-dpad-up", "up"); bindHold("field-dpad-down", "down");
  bindHold("field-dpad-left", "left"); bindHold("field-dpad-right", "right");

  document.getElementById("btn-use-orb").addEventListener("click", () => {
    if (field) field.corruption.reduceWithOrb(purificationInventory);
  });

  document.getElementById("btn-challenge-boss").addEventListener("click", () => {
    if (field && field.bossUnlocked && !field.bossActive) {
      field.spawnBoss();
      document.getElementById("field-log-line").textContent = "절망의 뿌리 갈퀴가 나타났다!";
    }
  });

  GameEventBus.subscribe(ChapterEvents.CHAPTER_CLEARED, () => {
    setTimeout(() => {
      endExploration("초원이 정화되었다! 챕터 1 클리어.");
      storyFlags.set("cleared_chapter1");
      GameManager.instance.advanceToChapter(ChapterType.MUSHROOM_FOREST);
    }, 300);
  });

  GameEventBus.subscribe(ChapterEvents.EVOLUTION_ADVANCED, (e) => {
    evoBanner.textContent = `✨ 진화! ${e.name}(으)로 성장했다.`;
    evoBanner.style.display = "block";
    setTimeout(() => { evoBanner.style.display = "none"; }, 3000);
  });

  GameEventBus.subscribe(CoreEvents.STORY_FLAG_SET, (e) => {
    if (e.flagName === "seen_two_year_timeskip") showChapter1Entry();
  });

  window.addEventListener("load", () => {
    if (storyFlags.has("seen_two_year_timeskip") && !storyFlags.has("cleared_chapter1")) showChapter1Entry();
  });
})();

class BreedingInventory {
  static SAVE_KEY = "cretyz_v2_breeding";

  constructor() { this.bredMonsterIds = new Set(); this.learnedSkillIds = []; }

  hasBred(monsterId) { return this.bredMonsterIds.has(monsterId); }

  breed(monsterId, formType) {
    if (this.hasBred(monsterId)) return false;
    const formData = PurifiedFormData[monsterId];
    if (!formData) return false;

    if (formType === PurifiedFormType.PET || formType === PurifiedFormType.PASSIVE) {
      const bonus = formData[formType];
      playerOrigin.maxHealth += bonus.healthBonus;
      playerOrigin.currentHealth += bonus.healthBonus;
      playerOrigin.attack += bonus.attackBonus;
      playerOrigin.save();
    } else if (formType === PurifiedFormType.SKILL) {
      this.learnedSkillIds.push(formData.SKILL.id);
    }

    this.bredMonsterIds.add(monsterId);
    this.save();
    GameEventBus.publish(BaseEvents.MONSTER_BRED, { monsterId, formType });
    return true;
  }

  toJSON() { return { bredMonsterIds: Array.from(this.bredMonsterIds), learnedSkillIds: this.learnedSkillIds }; }
  static fromJSON(json) {
    const inv = new BreedingInventory();
    inv.bredMonsterIds = new Set(json.bredMonsterIds);
    inv.learnedSkillIds = json.learnedSkillIds;
    return inv;
  }

  save() {
    try { localStorage.setItem(BreedingInventory.SAVE_KEY, JSON.stringify(this.toJSON())); return true; }
    catch (err) { console.error("[BreedingInventory] 저장 실패:", err); return false; }
  }

  static load() {
    try {
      const raw = localStorage.getItem(BreedingInventory.SAVE_KEY);
      if (!raw) return null;
      return BreedingInventory.fromJSON(JSON.parse(raw));
    } catch (err) { console.error("[BreedingInventory] 로드 실패:", err); return null; }
  }
}

// ---------- GenericFieldArena ----------
// Part4의 FieldArena와 로직은 거의 같지만, 몬스터풀/보스/챕터번호를 config로 받는다.
// 이제부터 새 챕터는 이 클래스를 재사용하고, config만 새로 만들면 된다.
class GenericFieldArena {
  constructor(widthPx, heightPx, config) {
    this.width = widthPx;
    this.height = heightPx;
    this.config = config;
    this.playerPos = { x: widthPx / 2, y: heightPx * 0.8 };
    this.playerMaxHealth = playerOrigin.maxHealth;
    this.playerHealth = playerOrigin.currentHealth > 0 ? playerOrigin.currentHealth : playerOrigin.maxHealth;
    this.enemies = [];
    this.skillCooldowns = new Map();
    this.moveState = { up: false, down: false, left: false, right: false };
    this.corruption = new CorruptionGaugeState();
    this.killCount = 0;
    this.bossUnlocked = false;
    this.bossActive = false;
    this.isOver = false;
  }

  spawnRegularEnemy() {
    const pool = Object.values(this.config.monsterPool);
    const template = pool[Math.floor(Math.random() * pool.length)];
    this.#spawnFromTemplate(template, false);
    bestiary.recordEncounter(template.id);
    this.corruption.onEncounter();
  }

  spawnBoss() { this.#spawnFromTemplate(this.config.bossTemplate, true); this.bossActive = true; }

  #spawnFromTemplate(template, isBoss) {
    const edge = Math.floor(Math.random() * 3);
    let x, y;
    if (edge === 0) { x = Math.random() * this.width; y = 0; }
    else if (edge === 1) { x = 0; y = Math.random() * this.height * 0.6; }
    else { x = this.width; y = Math.random() * this.height * 0.6; }
    this.enemies.push({
      id: crypto.randomUUID(), templateId: template.id, name: template.name, emoji: template.emoji,
      isBoss, pos: { x, y }, health: template.maxHealth, maxHealth: template.maxHealth,
      attack: template.attack, speed: isBoss ? 0.15 : 0.35
    });
  }

  movePlayer(deltaMs) {
    const speed = 0.3 * (this.config.movementSpeedMultiplier ?? 1);
    if (this.moveState.up) this.playerPos.y -= speed * deltaMs;
    if (this.moveState.down) this.playerPos.y += speed * deltaMs;
    if (this.moveState.left) this.playerPos.x -= speed * deltaMs;
    if (this.moveState.right) this.playerPos.x += speed * deltaMs;
    this.playerPos.x = Math.max(10, Math.min(this.width - 10, this.playerPos.x));
    this.playerPos.y = Math.max(10, Math.min(this.height - 10, this.playerPos.y));
  }

  moveEnemiesAndResolveContact(deltaMs) {
    for (const enemy of this.enemies) {
      const dx = this.playerPos.x - enemy.pos.x;
      const dy = this.playerPos.y - enemy.pos.y;
      const dist = Math.hypot(dx, dy) || 1;
      enemy.pos.x += (dx / dist) * enemy.speed * deltaMs;
      enemy.pos.y += (dy / dist) * enemy.speed * deltaMs;
      if (dist < 22) this.playerHealth = Math.max(0, this.playerHealth - enemy.attack * 0.002 * deltaMs);
    }
  }

  canUseSkill(skillId) {
    const def = getSkillDefinition(skillId);
    if (!def) return false;
    const lastUsed = this.skillCooldowns.get(skillId) ?? -Infinity;
    return performance.now() - lastUsed >= def.cooldownMs;
  }

  useSkill(skillId) {
    if (!this.canUseSkill(skillId)) return false;
    const skill = getSkillDefinition(skillId);
    this.skillCooldowns.set(skillId, performance.now());
    let closest = null, closestDist = Infinity;
    for (const enemy of this.enemies) {
      const dist = Math.hypot(enemy.pos.x - this.playerPos.x, enemy.pos.y - this.playerPos.y);
      if (dist <= skill.range && dist < closestDist) { closest = enemy; closestDist = dist; }
    }
    if (closest) {
      closest.health -= (skill.damage + playerOrigin.attack * 0.3);
      if (closest.health <= 0) this.#onEnemyDefeated(closest);
    }
    return true;
  }

  #onEnemyDefeated(enemy) {
    this.enemies = this.enemies.filter(e => e.id !== enemy.id);
    bestiary.recordPurified(enemy.templateId);
    purificationInventory.addBeads(enemy.isBoss ? 10 : (1 + Math.floor(Math.random() * 2)));

    if (enemy.isBoss) {
      this.bossActive = false;
      this.isOver = true;
      // 챕터별로 이벤트 이름을 분리해서, 예전 챕터1 리스너가 잘못 반응하지 않게 함
      GameEventBus.publish(`OnChapterCleared_${this.config.chapterNumber}`, { chapter: this.config.chapterNumber });
    } else {
      this.killCount += 1;
      if (this.killCount >= (this.config.killsToUnlockBoss ?? 5)) this.bossUnlocked = true;
    }
  }
}

    #gfa${p}-action-row button { background:#7a4a2b; color:#eafbe7; border:none; border-radius:8px; padding:8px 14px; font-size:12px; }
    #gfa${p}-action-row button:disabled { background:#3a2a1c; color:#8a7360; }
    #gfa${p}-log-line { text-align:center; font-size:12px; color:#9fd88a; margin-top:8px; min-height:16px; }
  `;
  document.head.appendChild(style);

  const root = document.getElementById("dynamic-content-root");

  const entryPanel = document.createElement("div");
  entryPanel.id = `ch${p}-entry-panel`;
  entryPanel.innerHTML = `
    <div>${config.title}</div>
    <div style="font-size:12px; color:#9fd88a; margin-top:6px;">${config.subtitle}</div>
    <button id="btn-enter-chapter${p}">탐험 시작</button>
  `;
  root.appendChild(entryPanel);

  const wrap = document.createElement("div");
  wrap.id = `gfa${p}-wrap`;
  wrap.innerHTML = `
    <div>
      <div style="font-size:11px; color:#c99bf0; margin-bottom:4px;">오염도</div>
      <div id="gfa${p}-corruption-outer"><div id="gfa${p}-corruption-fill"></div></div>
    </div>
    <div id="gfa${p}-resource-row">
      <div>💧 정화구슬: <span id="gfa${p}-bead-count">0</span></div>
      <div>🔮 정화구: <span id="gfa${p}-orb-count">0</span></div>
    </div>
    <div id="gfa${p}-arena"></div>
    <div id="gfa${p}-controls">
      <div id="gfa${p}-dpad">
        <div></div><button id="gfa${p}-dpad-up">▲</button><div></div>
        <button id="gfa${p}-dpad-left">◀</button><div></div><button id="gfa${p}-dpad-right">▶</button>
        <div></div><button id="gfa${p}-dpad-down">▼</button><div></div>
      </div>
      <div id="gfa${p}-skill-buttons"></div>
    </div>
    <div id="gfa${p}-action-row">
      <button id="gfa${p}-btn-use-orb">🔮 정화구 사용 (오염도 -25)</button>
      <button id="gfa${p}-btn-challenge-boss" disabled>👑 ${config.bossTemplate.name} 도전</button>
    </div>
    <div id="gfa${p}-log-line"></div>
  `;
  root.appendChild(wrap);

  // 플레이어/적 스프라이트, HP바는 매 프레임 새로 만들지 않고 미리 만들어 재사용
  const arenaEl = document.getElementById(`gfa${p}-arena`);
  const playerSprite = document.createElement("div");
  playerSprite.style.cssText = "position:absolute; font-size:24px; transform:translate(-50%,-50%);";
  playerSprite.textContent = "🌱";
  const playerHpOuter = document.createElement("div");
  playerHpOuter.style.cssText = "position:absolute; background:#1c2b1f; border-radius:6px; height:5px; overflow:hidden; width:36px;";
  const playerHpFill = document.createElement("div");
  playerHpFill.style.cssText = "background:#7ED957; height:100%; width:100%;";
  playerHpOuter.appendChild(playerHpFill);
  arenaEl.appendChild(playerHpOuter);
  arenaEl.appendChild(playerSprite);

  let field = null, lastFrameTime = null, spawnTimerMs = 0, rafId = null;

  function showEntry() { entryPanel.style.display = "block"; }

  document.getElementById(`btn-enter-chapter${p}`).addEventListener("click", () => {
    entryPanel.style.display = "none";
    startExploration();
  });

  function renderSkillButtons() {
    const container = document.getElementById(`gfa${p}-skill-buttons`);
    container.innerHTML = "";
    for (const skillId of getAvailableSkillIds()) {
      const def = getSkillDefinition(skillId);
      const btn = document.createElement("button");
      btn.id = `gfa${p}-skill-${skillId}`;
      btn.textContent = def.label;
      btn.addEventListener("click", () => { if (field && !field.isOver) field.useSkill(skillId); });
      container.appendChild(btn);
    }
  }

  function startExploration() {
    wrap.style.display = "block";
    field = new GenericFieldArena(380, 340, config);
    renderSkillButtons();
    lastFrameTime = performance.now();
    spawnTimerMs = 0;
    document.getElementById(`gfa${p}-log-line`).textContent = "탐색을 시작한다...";
    rafId = requestAnimationFrame(tick);
  }

  function endExploration(message) {
    field.isOver = true;
    cancelAnimationFrame(rafId);
    playerOrigin.currentHealth = Math.max(1, Math.round(field.playerHealth));
    playerOrigin.save();
    document.getElementById(`gfa${p}-log-line`).textContent = message;
    setTimeout(() => { wrap.style.display = "none"; }, 1800);
  }

  function tick(now) {
    const deltaMs = now - lastFrameTime;
    lastFrameTime = now;

    if (!field.isOver) {
      field.movePlayer(deltaMs);
      field.moveEnemiesAndResolveContact(deltaMs);
      field.corruption.tick(deltaMs / 1000);

      if (field.corruption.isOverloaded) {
        purificationInventory.applyOverloadPenalty();
        endExploration("오염도가 폭주했다! 강제로 귀환한다. (정화구 절반 손실)");
        return;
      }
      if (field.playerHealth <= 0) { endExploration("쓰러졌다... 기지로 돌아간다."); return; }

      spawnTimerMs += deltaMs;
      const spawnInterval = field.bossActive ? Infinity : 1800;
      if (spawnTimerMs > spawnInterval && field.enemies.length < 5 && !field.bossActive) {
        field.spawnRegularEnemy();
        spawnTimerMs = 0;
      }
    }
    render();
    if (!field.isOver) rafId = requestAnimationFrame(tick);
  }

  function render() {
    playerSprite.style.left = `${field.playerPos.x}px`;
    playerSprite.style.top = `${field.playerPos.y}px`;
    playerHpOuter.style.left = `${field.playerPos.x - 18}px`;
    playerHpOuter.style.top = `${field.playerPos.y - 22}px`;
    playerHpFill.style.width = `${Math.max(0, field.playerHealth / field.playerMaxHealth) * 100}%`;

    document.getElementById(`gfa${p}-corruption-fill`).style.width = `${field.corruption.value}%`;
    document.getElementById(`gfa${p}-bead-count`).textContent = purificationInventory.beadCount;
    document.getElementById(`gfa${p}-orb-count`).textContent = purificationInventory.orbCount;

    if (config.highCorruptionFilter) {
      arenaEl.style.filter = field.corruption.value > 50 ? config.highCorruptionFilter : "none";
    }

    arenaEl.querySelectorAll(".gfa-enemy-node").forEach(el => el.remove());
    for (const enemy of field.enemies) {
      const es = document.createElement("div");
      es.className = "gfa-enemy-node";
      es.style.cssText = `position:absolute; font-size:${enemy.isBoss ? 42 : 24}px; transform:translate(-50%,-50%); left:${enemy.pos.x}px; top:${enemy.pos.y}px;`;
      es.textContent = enemy.emoji;
      arenaEl.appendChild(es);

      const hpW = enemy.isBoss ? 50 : 24;
      const hpOuterEl = document.createElement("div");
      hpOuterEl.className = "gfa-enemy-node";
      hpOuterEl.style.cssText = `position:absolute; background:#1c2b1f; border-radius:6px; height:5px; overflow:hidden; width:${hpW}px; left:${enemy.pos.x - hpW / 2}px; top:${enemy.pos.y - (enemy.isBoss ? 30 : 17)}px;`;
      const hpFillEl = document.createElement("div");
      hpFillEl.style.cssText = `height:100%; width:${Math.max(0, enemy.health / enemy.maxHealth) * 100}%; background:${enemy.isBoss ? "#e0a020" : "#c9564d"};`;
      hpOuterEl.appendChild(hpFillEl);
      arenaEl.appendChild(hpOuterEl);
    }

    for (const skillId of getAvailableSkillIds()) {
      const btn = document.getElementById(`gfa${p}-skill-${skillId}`);
      if (btn) btn.disabled = field.isOver || !field.canUseSkill(skillId);
    }
    document.getElementById(`gfa${p}-btn-use-orb`).disabled = field.isOver || purificationInventory.orbCount <= 0;
    document.getElementById(`gfa${p}-btn-challenge-boss`).disabled = field.isOver || !field.bossUnlocked || field.bossActive;
  }

  function bindHold(buttonId, direction) {
    const btn = document.getElementById(buttonId);
    const start = () => { if (field) field.moveState[direction] = true; };
    const stop = () => { if (field) field.moveState[direction] = false; };
    btn.addEventListener("touchstart", start);
    btn.addEventListener("touchend", stop);
    btn.addEventListener("mousedown", start);
    btn.addEventListener("mouseup", stop);
    btn.addEventListener("mouseleave", stop);
  }
  bindHold(`gfa${p}-dpad-up`, "up"); bindHold(`gfa${p}-dpad-down`, "down");
  bindHold(`gfa${p}-dpad-left`, "left"); bindHold(`gfa${p}-dpad-right`, "right");

  document.getElementById(`gfa${p}-btn-use-orb`).addEventListener("click", () => {
    if (field) field.corruption.reduceWithOrb(purificationInventory);
  });
  document.getElementById(`gfa${p}-btn-challenge-boss`).addEventListener("click", () => {
    if (field && field.bossUnlocked && !field.bossActive) {
      field.spawnBoss();
      document.getElementById(`gfa${p}-log-line`).textContent = `${config.bossTemplate.name}이(가) 나타났다!`;
    }
  });

  GameEventBus.subscribe(`OnChapterCleared_${p}`, () => {
    setTimeout(() => {
      endExploration(`${config.title} 클리어!`);
      storyFlags.set(config.clearedFlag);
      GameManager.instance.advanceToChapter(config.nextChapterType);
    }, 300);
  });

  GameEventBus.subscribe(CoreEvents.STORY_FLAG_SET, (e) => { if (e.flagName === config.entryFlag) showEntry(); });
  window.addEventListener("load", () => {
    if (storyFlags.has(config.entryFlag) && !storyFlags.has(config.clearedFlag)) showEntry();
  });
}

// ---------- 스킬 조합 시스템 (챕터3 해금) ----------

// 기존 BaseSkills 객체(Part3에서 const로 선언됨)에 독가루 스킬을 추가.
// const는 "재할당"만 막을 뿐 객체 속성 추가는 막지 않으므로, 이렇게 append로 확장 가능.
BaseSkills.POISON_POWDER = { id: "POISON_POWDER", label: "☠️ 독가루뿌리기", cooldownMs: 2600, range: 150, damage: 5, statusEffect: StatusEffectType.POISON };

function getFusionKey(idA, idB) { return [idA, idB].sort().join("+"); }

const SkillFusionTable = {
  [getFusionKey("ICE_POWDER", "VINE_BIND")]:  { id: "ICE_VINE_BIND", label: "🥶🌿 얼음덩굴속박", cooldownMs: 3200, range: 150, damage: 9,  statusEffect: StatusEffectType.FREEZE },
  [getFusionKey("FLAME_SHOT", "SEED_SHOT")]:  { id: "BLAZING_SEED",  label: "🔥🌰 화염씨앗",     cooldownMs: 2600, range: 230, damage: 12, statusEffect: StatusEffectType.BURN },
  [getFusionKey("POISON_POWDER", "VINE_BIND")]: { id: "TOXIC_BIND",  label: "☠️🌿 맹독속박",    cooldownMs: 3000, range: 140, damage: 8,  statusEffect: StatusEffectType.POISON },
  [getFusionKey("FLAME_SHOT", "ICE_POWDER")]: { id: "STEAM_BURST",   label: "💨🔥 증기폭발",     cooldownMs: 3400, range: 180, damage: 14 }
};

class SkillCraftingBench {
  static SAVE_KEY = "cretyz_v2_craftedskills";

  constructor() { this.craftedSkillIds = new Set(); }

  canCombine(idA, idB) { return !!SkillFusionTable[getFusionKey(idA, idB)]; }

  combine(idA, idB) {
    const result = SkillFusionTable[getFusionKey(idA, idB)];
    if (!result) return null;
    this.craftedSkillIds.add(result.id);
    this.save();
    return result;
  }

  toJSON() { return { craftedSkillIds: Array.from(this.craftedSkillIds) }; }
  static fromJSON(json) { const b = new SkillCraftingBench(); b.craftedSkillIds = new Set(json.craftedSkillIds); return b; }

  save() {
    try { localStorage.setItem(SkillCraftingBench.SAVE_KEY, JSON.stringify(this.toJSON())); return true; }
    catch (err) { console.error("[SkillCraftingBench] 저장 실패:", err); return false; }
  }

  static load() {
    try {
      const raw = localStorage.getItem(SkillCraftingBench.SAVE_KEY);
      if (!raw) return null;
      return SkillCraftingBench.fromJSON(JSON.parse(raw));
    } catch (err) { console.error("[SkillCraftingBench] 로드 실패:", err); return null; }
  }
}

let skillCraftingBench = SkillCraftingBench.load() || new SkillCraftingBench();

// getAvailableSkillIds / getSkillDefinition을 "다시 선언"해서 합성 스킬까지 포함하도록 확장.
// 자바스크립트는 같은 이름의 function이 나중에 또 선언되면 나중 것이 실제로 쓰인다 -
// Part4의 원래 코드는 한 글자도 건드리지 않고 기능만 넓히는 합법적인 방법.
function getAvailableSkillIds() {
  const ids = Object.keys(BaseSkills);
  for (const monsterId of Object.keys(PurifiedFormData)) {
    const skillDef = PurifiedFormData[monsterId].SKILL;
    if (breedingInventory.learnedSkillIds.includes(skillDef.id)) ids.push(skillDef.id);
  }
  for (const skillId of skillCraftingBench.craftedSkillIds) ids.push(skillId);
  return ids;
}

function getSkillDefinition(skillId) {
  if (BaseSkills[skillId]) return BaseSkills[skillId];
  for (const monsterId of Object.keys(PurifiedFormData)) {
    if (PurifiedFormData[monsterId].SKILL.id === skillId) return PurifiedFormData[monsterId].SKILL;
  }
  for (const key in SkillFusionTable) {
    if (SkillFusionTable[key].id === skillId) return SkillFusionTable[key];
  }
  return null;
}

// ---------- 스킬 제작대 UI ----------
(function initSkillCraftingUI() {
  const style = document.createElement("style");
  style.textContent = `
    #btn-open-crafting { display:none; max-width:420px; margin:12px auto; width:100%; background:#5a3a7a; color:#eafbe7; border:none; padding:12px; border-radius:10px; font-size:14px; cursor:pointer; }

    #crafting-result { margin-top:10px; font-size:13px; color:#c99bf0; min-height:18px; }

  `;
  document.head.appendChild(style);

  const root = document.getElementById("dynamic-content-root");

  const openBtn = document.createElement("button");
  openBtn.id = "btn-open-crafting";
  openBtn.textContent = "🧪 스킬 제작대";
  root.appendChild(openBtn);

  const panel = document.createElement("div");
  panel.id = "crafting-panel";
  panel.innerHTML = `
    <div>1단 스킬 두 개를 합쳐 새로운 스킬을 만든다.</div>
    <div>
      <select id="fusion-select-a"></select>
      <select id="fusion-select-b"></select>
    </div>
    <button class="combine-btn" id="btn-combine-skills">합성</button>
    <div id="crafting-result"></div>
    <div id="crafted-list"></div>
  `;
  root.appendChild(panel);

  function populateSelects() {
    const baseIds = Object.keys(BaseSkills);
    for (const selId of ["fusion-select-a", "fusion-select-b"]) {
      const sel = document.getElementById(selId);
      sel.innerHTML = baseIds.map(id => `<option value="${id}">${BaseSkills[id].label}</option>`).join("");
    }
  }

  function renderCraftedList() {
    const listEl = document.getElementById("crafted-list");
    if (skillCraftingBench.craftedSkillIds.size === 0) {
      listEl.textContent = "아직 합성한 스킬이 없다.";
      return;
    }
    listEl.innerHTML = "합성 완료: " + Array.from(skillCraftingBench.craftedSkillIds)
      .map(id => getSkillDefinition(id).label).join(", ");
  }

  document.getElementById("btn-combine-skills").addEventListener("click", () => {
    const idA = document.getElementById("fusion-select-a").value;
    const idB = document.getElementById("fusion-select-b").value;
    if (idA === idB) {
      document.getElementById("crafting-result").textContent = "같은 스킬끼리는 합성할 수 없다.";
      return;
    }
    const result = skillCraftingBench.combine(idA, idB);
    document.getElementById("crafting-result").textContent = result
      ? `✨ ${result.label} 을(를) 습득했다!`
      : "아직 발견되지 않은 조합이다.";
    renderCraftedList();
  });

  openBtn.addEventListener("click", () => {
    const isOpen = panel.style.display === "block";
    panel.style.display = isOpen ? "none" : "block";
    if (!isOpen) { populateSelects(); renderCraftedList(); }
  });

  function unlockIfChapter3(chapterNumber) {
    if (chapterNumber >= 3) openBtn.style.display = "block";
  }

  GameEventBus.subscribe(CoreEvents.CHAPTER_CHANGED, (e) => unlockIfChapter3(e.chapter));
  window.addEventListener("load", () => unlockIfChapter3(GameManager.instance.currentChapter));
})();
</script>
